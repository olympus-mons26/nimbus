[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-weather-cli"
version = "1.0.0"
description = "A friendly, cross-platform weather forecast CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "olympus-mons26" }]
keywords = ["weather", "cli", "open-meteo"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["pyinstaller>=6.8,<7"]

[project.scripts]
wf = "nimbus.main:main"
wi = "nimbus.main:main"
wd = "nimbus.main:main"
ws = "nimbus.main:main"
wai = "nimbus.main:main"
wh = "nimbus.main:main"
weather = "nimbus.main:main"

[project.urls]
Homepage = "https://github.com/olympus-mons26/nimbus"
Repository = "https://github.com/olympus-mons26/nimbus"
Issues = "https://github.com/olympus-mons26/nimbus/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nimbus*"]

[tool.setuptools.package-data]
nimbus = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
