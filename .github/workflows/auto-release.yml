name: Nimbus Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nimbus-auto-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest -v

      - name: Build Nimbus
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version_file = Path("src/nimbus/__init__.py")
          source = version_file.read_text(encoding="utf-8")
          old = '__version__ = "1.0.0"'
          if source.count(old) != 1:
              raise SystemExit("Could not find the package version declaration.")
          version_file.write_text(
              source.replace(old, f'__version__ = "{sys.argv[1]}"'),
              encoding="utf-8",
          )
          PY

          pyinstaller \
            --onefile \
            --name wf \
            --clean \
            --paths src \
            --collect-all nimbus \
            --collect-all rich \
            src/nimbus/main.py

      - name: Package release
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p staging

          cp dist/wf staging/
          cp README.md staging/README.txt

          tar -czf \
            "nimbus-macos-arm64.tar.gz" \
            -C staging .

          mkdir -p dmg-root
          cp dist/wf dmg-root/
          cp README.md dmg-root/README.txt

          hdiutil create \
            -volname "Nimbus" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "Nimbus-macos-arm64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-release
          path: |
            nimbus-macos-arm64.tar.gz
            Nimbus-macos-arm64.dmg

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nimbus-release

      - name: Generate checksum
        run: |
          sha256sum nimbus-macos-arm64.tar.gz \
            > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          gh release create "$VERSION" \
            nimbus-macos-arm64.tar.gz \
            Nimbus-macos-arm64.dmg \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nimbus $VERSION" \
            --generate-notes \
            --prerelease

  update-tap:
    needs: [build, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: olympus-mons26/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts

          gh release download \
            "${{ needs.build.outputs.version }}" \
            --repo olympus-mons26/nimbus \
            --pattern "nimbus-macos-arm64.tar.gz" \
            --dir artifacts

      - name: Update formula
        working-directory: homebrew-tap
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          SHA=$(sha256sum \
            ../artifacts/nimbus-macos-arm64.tar.gz | awk '{print $1}')

          cat > Formula/nimbus.rb <<EOF
          class Nimbus < Formula
            desc "A command-line weather reporter"
            homepage "https://github.com/olympus-mons26/nimbus"
            version "${VERSION}"
            license "MIT"

            url "https://github.com/olympus-mons26/nimbus/releases/download/${VERSION}/nimbus-macos-arm64.tar.gz"
            sha256 "${SHA}"

            depends_on :macos

            def install
              bin.install "wf"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/wf --version")
            end
          end
          EOF

      - name: Push updated formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/nimbus.rb
          git commit -m "Update Nimbus to ${{ needs.build.outputs.version }}"
          git push
