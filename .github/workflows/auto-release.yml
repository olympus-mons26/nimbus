name: Nimbus Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nimbus-auto-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,build]"

      - name: Run tests
        run: python -m pytest -v

      - name: Build Nimbus
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python scripts/build.py \
            --version "$VERSION" \
            --artifact-name nimbus-macos-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-release
          path: |
            dist/nimbus-macos-arm64.tar.gz
            dist/nimbus-macos-arm64.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nimbus-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          gh release create "$VERSION" \
            nimbus-macos-arm64.tar.gz \
            nimbus-macos-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nimbus $VERSION" \
            --generate-notes \
            --prerelease

  update-tap:
    needs: [build, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: olympus-mons26/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts

          gh release download \
            "${{ needs.build.outputs.version }}" \
            --repo olympus-mons26/nimbus \
            --pattern "nimbus-macos-arm64.tar.gz" \
            --dir artifacts

      - name: Update formula
        working-directory: homebrew-tap
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          SHA=$(sha256sum \
            ../artifacts/nimbus-macos-arm64.tar.gz | awk '{print $1}')

          cat > Formula/nimbus.rb <<EOF
          class Nimbus < Formula
            desc "A command-line weather reporter"
            homepage "https://github.com/olympus-mons26/nimbus"
            version "${VERSION}"
            license "MIT"

            url "https://github.com/olympus-mons26/nimbus/releases/download/${VERSION}/nimbus-macos-arm64.tar.gz"
            sha256 "${SHA}"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "wf"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/wf --version")
            end
          end
          EOF

      - name: Push updated formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/nimbus.rb
          git commit -m "Update Nimbus to ${{ needs.build.outputs.version }}"
          git push
